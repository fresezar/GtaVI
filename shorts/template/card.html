<!doctype html>
<!-- Overlay cards for scripts/make-short.mjs. Rendered by headless Chrome at 1080x1920 with a transparent page.
     Mode and text come in the URL hash as JSON: card.html#{"mode":"hook","file":"0001","text":"..."} -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("../../node_modules/@fontsource/shrikhand/files/shrikhand-latin-400-normal.woff2"); }
  @font-face { font-family: "Sans"; src: url("../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2"); font-weight: 100 1000; }
  :root { --navy: #0E1A2B; --coral: #FF6A55; --cream: #FFF4EC; }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: "Sans", sans-serif; color: var(--navy); position: relative; }
  .tag { display: inline-block; background: var(--coral); color: var(--cream); font-weight: 800; letter-spacing: .12em;
         font-size: 30px; padding: 10px 20px; border-radius: 6px; text-transform: uppercase; }
  /* Platform UI covers roughly the top 220 px, the bottom 420 px and the right 140 px: keep text inside. */
  .hook { position: absolute; left: 60px; right: 140px; top: 250px; }
  .hook .box { margin-top: 18px; background: var(--cream); border: 6px solid var(--navy); border-radius: 18px;
               padding: 28px 34px; font-weight: 850; font-size: 66px; line-height: 1.08; box-shadow: 12px 12px 0 var(--navy); }
  .credit { position: absolute; left: 60px; right: 140px; top: 1330px; color: var(--cream); font-weight: 700; font-size: 34px;
            text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .wm { position: absolute; left: 60px; top: 1280px; color: var(--cream); opacity: .85; font-weight: 800; font-size: 28px;
        letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .credit .fact { display: block; margin-top: 14px; font-weight: 800; font-size: 44px; line-height: 1.15; }
  .label { position: absolute; left: 60px; right: 140px; top: 250px; }
  .label .place { margin-top: 18px; color: var(--cream); font-family: "Display"; font-size: 84px; line-height: 1.05;
                  text-shadow: 0 4px 0 var(--navy), 0 0 24px rgba(0,0,0,.6); }
  .label-cta { position: absolute; left: 60px; right: 140px; top: 1380px; color: var(--cream); font-weight: 800; font-size: 46px;
               text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  .end { position: absolute; inset: 0; background: var(--navy); color: var(--cream); display: flex; flex-direction: column;
         align-items: center; justify-content: center; text-align: center; padding: 0 90px 200px; box-sizing: border-box; }
  .end img { width: 360px; }
  .end .file { margin-top: 40px; }
  .end .line { margin-top: 44px; font-size: 48px; font-weight: 700; }
  .end .url { margin-top: 10px; font-family: "Display"; color: var(--coral); font-size: 104px; line-height: 1; }
  .end .small { margin-top: 60px; font-size: 26px; opacity: .6; }
</style>
</head>
<body>
<script>
  const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const file = `<span class="tag">Six Star File #${esc(d.file)}</span>`;
  const html = {
    hook: `<div class="hook">${file}<div class="box">${esc(d.text)}</div></div>`,
    credit: `<div class="wm">sixstargta.com</div><div class="credit">${d.credit ? "Clip: " + esc(d.credit) : ""}${d.fact ? `<span class="fact">${esc(d.fact)}</span>` : ""}</div>`,
    label: `<div class="label">${file}<div class="place">${esc(d.place)}</div></div><div class="label-cta">${esc(d.cta || "Pinned on sixstargta.com")}</div>`,
    end: `<div class="end"><img src="../../public/brand/logo.svg" alt=""><div class="file">${file}</div>
          <div class="line">${esc(d.line || "Map pin + full guide")}</div><div class="url">sixstargta.com</div>
          <div class="small">Unofficial fan site. Not affiliated with Rockstar Games.</div></div>`,
  }[d.mode] ?? "";
  document.body.innerHTML = html;
  document.fonts.ready.then(() => { document.title = "ready"; });
</script>
</body>
</html>

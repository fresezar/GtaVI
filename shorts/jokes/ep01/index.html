<!doctype html>
<!-- Joke short #1, "The Unluckiest Man". Driven by shorts/jokes/render.mjs: setup(data), render(t), sfx(). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("../../../node_modules/@fontsource/shrikhand/files/shrikhand-latin-400-normal.woff2"); }
  @font-face { font-family: "Sans"; src: url("../../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2"); font-weight: 100 1000; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1a1430; }
  svg { display: block; position: absolute; inset: 0; }
  text { font-family: "Display"; }
  .cap { position: absolute; left: 70px; right: 150px; top: 1370px; text-align: center; font-family: "Sans"; font-weight: 900;
         font-size: 84px; line-height: 1.04; color: #fff; text-transform: uppercase;
         -webkit-text-stroke: 16px #2a2238; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .cap b { color: #ffd23f; }
</style>
</head>
<body>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="cap" id="cap"></div>
<script src="../cast.js"></script>
<script>
let D = null;
function setup(d) { D = d; }

// ---------- scenes ----------
function scenes() {
  return [
    { at: 0, f: sStreet },
    { at: S("L03") - 0.15, f: sFly },
    { at: S("L04") - 0.05, f: sEngine },
    { at: S("L05") - 0.35, f: sCaptain },
    { at: S("L06") - 0.1, f: sDraw },
    { at: S("L09") - 0.1, f: sAsk },
    { at: S("L12") - 0.1, f: sLaugh },
    { at: S("L13") - 0.1, f: sOne },
    { at: S("L15") - 0.1, f: sThree },
    { at: E("L16") + 0.15, f: sJaw },
    { at: S("L17") - 0.15, f: sMath },
    { at: S("L18") - 0.2, f: sFall },
  ];
}

function sStreet(t) {
  const u = U(t, 0.2, 1.2), z = lerp(1.15, 1.0, ease(u));
  let s = street(t);
  const barAt = E("L02") - 0.35;
  const bar = t > barAt ? "×1" : null;
  s += hero({ x: 470, y: 1510, s: 1.12, t, expr: t > S("L02") ? "sad" : "neutral", look: t > S("L02") ? 0 : -0.3, bar, barScale: back(U(t, barAt, barAt + 0.3)) });
  s += rainCloud(470, 440, t, 1.3, (t % 2.2) < 0.18);
  if (t > S("L01") + 1.3 && t < S("L02")) s += word(800, 640, "WORST|LUCK", 84, "#ff6a55", -8, back(U(t, S("L01") + 1.3, S("L01") + 1.6)));
  return cam(540, 960, z, 0, 0, 0, s);
}

function sFly(t, t0) {
  const u = U(t, t0, E("L03") + 0.2);
  let s = sky(t, 1.2);
  const px = lerp(-250, 560, ease(u)), py = 960 + Math.sin(t * 2) * 14;
  s += plane({ x: px, y: py, s: 1.25, t, ang: -2, face: "neutral" });
  s += rainCloud(px - 20, py - 300, t, 1.0, (t % 1.9) < 0.15);
  return s;
}

function sEngine(t, t0) {
  const boomAt = E("L04") - 0.45, u = U(t, boomAt, boomAt + 1.4);
  const [sx, sy] = shake(t, t > boomAt ? 14 : 3);
  let s = sky(t, 1.2, t > boomAt ? 0.25 : 0);
  const ang = lerp(0, 22, ease(u));
  s += plane({ x: 540, y: 960 + 80 * ease(u), s: 1.3, t, ang, smoke: t > boomAt, fire: t > boomAt ? 0.7 + 0.3 * Math.abs(Math.sin(t * 18)) : 0, face: t > boomAt ? "scared" : "neutral" });
  s += rainCloud(520, 640 + 80 * ease(u), t, 1.0, t > boomAt && (t % 0.6) < 0.2);
  if (t > boomAt) s += word(540, 470, "BOOM!", 150, "#ff6a55", -8, back(U(t, boomAt, boomAt + 0.3)));
  if (t > boomAt && (t % 0.5) < 0.25) s += `<rect x="0" y="0" width="1080" height="1920" fill="#ff2020" opacity=".14"/>`;
  return cam(540, 960, 1, 0, sx, sy, s);
}

function sCaptain(t, t0) {
  const [sx, sy] = shake(t, 5);
  let s = cabin(t);
  s += passenger({ x: 195, y: 935, s: 0.72, skin: "#f3cfb2", hair: "#c9c6d6", style: "bun", shirt: "#b5689a", expr: "pray", glasses: true, t });
  s += captain({ x: 540, y: 1200, s: 1.0, t, talk: talkOf("captain", t) });
  s += seatBack(70, 1000, 380, 1000) + seatBack(640, 1000, 340, 1000);
  s += brickSeated(260, 1110, t, "bored");
  s += heroSeated(790, 1090, t, "scared") + frontRow();
  if (t > S("L05") - 0.05) s += bubble(556, 420, 640, 330, "SOMEONE|HAS TO JUMP!", 62, 548, 760, back(U(t, S("L05") - 0.05, S("L05") + 0.25)), true);
  return cam(540, 1000, 1.16, -7 + Math.sin(t * 2) * 1.5, sx, sy, s);
}
function brickSeated(x, y, t, expr, chew = true) {
  return g(`translate(${x} ${y}) scale(0.9)`, brick({ x: 0, y: 800, s: 1, t, expr, chew, pose: "nuts" }));
}
const frontRow = () => seatBack(20, 1640, 470, 600) + seatBack(590, 1640, 470, 600);
function heroSeated(x, y, t, expr, talk = 0) {
  return g(`translate(${x} ${y})`, hero({ x: 0, y: 700, s: 1, t, expr, talk, pose: "down" }));
}

function sDraw(t) {
  const counts = [E("L06") - 0.45, MID("L08", 0.3), MID("L08", 0.5), MID("L08", 0.62), MID("L08", 0.72)];
  const n = counts.filter((c) => t >= c).length;
  let s = `<rect x="0" y="0" width="1080" height="1920" fill="#2d2350"/>`;
  s += g(`translate(540 860) rotate(${t * 8})`, Array.from({ length: 16 }, (_, i) => `<path d="M0,0 L${Math.cos(i * Math.PI / 8) * 1400},${Math.sin(i * Math.PI / 8) * 1400} L${Math.cos((i + 0.5) * Math.PI / 8) * 1400},${Math.sin((i + 0.5) * Math.PI / 8) * 1400} Z" fill="#3a2f66"/>`).filter((_, i) => i % 2 === 0).join(""));
  // captain's cap, upside down, full of names
  const last = counts[Math.max(0, n - 1)];
  if (n > 0) {
    const pu = back(U(t, last, last + 0.3)), rot = [-8, 6, -4, 9, -2][n - 1];
    s += g(`translate(540 ${lerp(820, 560, pu)}) rotate(${rot})`, P("M-190,-120 h380 v240 h-380 z", "#fffdf5", 7) +
      `<path d="M-160,-80 h320 M-160,90 h320" stroke="#e7dfc8" stroke-width="4"/>` +
      g("translate(0 6) scale(0.62)", heroHead({ expr: "neutral", t: 0 })) + P("M-150,-95 L150,95 M150,-95 L-150,95", "none", 0));
  }
  s += g("translate(540 880)", P("M-230,0 q0,-150 230,-150 q230,0 230,150 z", "#24336e", 7) + P("M-260,-10 h520 q10,30 -20,40 h-480 q-30,-10 -20,-40 z", O, 5) + circ(0, -90, 24, "#f2c14e", 5));
  if (n > 0) s += word(470, 330, "×" + n, 190, "#ffd23f", -6, back(U(t, last, last + 0.25)));
  if (n >= 5) s += word(800, 470, "IN A ROW!", 64, "#ff6a55", 8, back(U(t, counts[4] + 0.2, counts[4] + 0.5)));
  // the man reacts below
  const tk = talkOf("hero", t);
  const expr = t >= S("L07") && t <= E("L07") + 0.2 ? "shout" : n >= 4 ? "cry" : n >= 2 ? "sad" : n === 1 ? "shock" : "neutral";
  const shakeX = expr === "shout" ? Math.sin(t * 40) * 10 : 0;
  s += g(`translate(${470 + shakeX} 1200) scale(1.1)`, heroHead({ expr, talk: tk, t }));
  s += rainCloud(470 + shakeX, 1010, t, 0.75, n >= 3 && (t % 0.7) < 0.2);
  return s;
}

function sAsk(t) {
  const tk = talkOf("hero", t);
  const pose = t < S("L10") ? "down" : t < S("L11") ? "finger" : "point";
  const z = t < S("L11") ? 1.25 : lerp(1.25, 1.0, ease(U(t, S("L11"), S("L11") + 0.6)));
  const cx = t < S("L11") ? 380 : lerp(380, 560, ease(U(t, S("L11"), S("L11") + 0.6)));
  let s = cabin(t);
  s += passenger({ x: 300, y: 930, s: 0.66, skin: "#e0ac85", hair: "#2a2238", style: "afro", shirt: "#ffb347", expr: "neutral", t, seed: 1 });
  s += passenger({ x: 780, y: 930, s: 0.66, skin: "#f3cfb2", hair: "#c9c6d6", style: "bun", shirt: "#b5689a", expr: "neutral", glasses: true, t, seed: 2 });
  s += seatBack(640, 1000, 360, 1000);
  s += g("translate(820 1120)", brick({ x: 0, y: 760, s: 0.92, t, expr: "bored", chew: true, pose: "nuts" }));
  s += P("M560,1560 h560 v500 h-560 z", "url(#seat)", 6);
  s += hero({ x: 330, y: 1840, s: 1.1, t, expr: tk > 0 ? "neutral" : "smug", talk: tk, pose });
  s += rainCloud(330, 860, t, 0.9);
  if (t > S("L11") + 0.8) {
    for (const [x, y, d] of [[300, 760, 0], [780, 760, 0.15], [820, 930, 0.3]]) s += word(x, y, "?", 110, "#ffd23f", 0, back(U(t, S("L11") + 0.8 + d, S("L11") + 1.1 + d)));
  }
  return cam(cx, 1000, z, -3, 0, 0, s);
}

function sLaugh(t) {
  const fourAt = MID("L12", 0.68);
  let s = cabin(t);
  const ppl = [[200, 880, "#e0ac85", "#2a2238", "afro", "#ffb347"], [420, 960, "#f3cfb2", "#c9c6d6", "bun", "#b5689a"], [660, 960, "#8d5a3b", "#2a2238", "cap", "#7ec8e3"], [880, 880, "#f6d6b8", "#e0a040", "short", "#9ad17a"]];
  ppl.forEach(([x, y, sk, hr, st, sh], i) => { s += passenger({ x, y, s: 0.8, skin: sk, hair: hr, style: st, shirt: sh, expr: "laugh", t, seed: i * 1.7, glasses: st === "bun" }); });
  s += captain({ x: 540, y: 1360, s: 0.85, t, expr: "laugh" });
  s += seatBack(640, 1100, 360, 900);
  s += g("translate(820 1200)", brick({ x: 0, y: 760, s: 0.92, t, expr: "bored", chew: true, pose: "nuts" }));
  for (const [x, y, r, d] of [[180, 620, -10, 0], [880, 600, 12, 0.2], [300, 1180, 8, 0.35]]) s += word(x, y, "HA HA", 70, "#fff", r, back(U(t, S("L12") + d, S("L12") + d + 0.25)));
  if (t > fourAt) s += word(500, 520, "4!", 260, "#ffd23f", -6, back(U(t, fourAt, fourAt + 0.3)));
  const [sx, sy] = shake(t, 3);
  return cam(540, 1000, 1.08, Math.sin(t * 9) * 1.2, sx, sy, s);
}

function sOne(t) {
  const barAt = MID("L14", 0.62), tk = talkOf("hero", t);
  let s = cabin(t);
  s += passenger({ x: 230, y: 900, s: 0.7, skin: "#e0ac85", hair: "#2a2238", style: "afro", shirt: "#ffb347", expr: t > barAt ? "shock" : "neutral", t, seed: 1 });
  s += passenger({ x: 850, y: 900, s: 0.7, skin: "#8d5a3b", hair: "#2a2238", style: "cap", shirt: "#7ec8e3", expr: t > barAt ? "shock" : "neutral", t, seed: 3 });
  s += hero({ x: 470, y: 1820, s: 1.15, t, expr: tk > 0 ? "shout" : "smug", talk: tk, pose: "hips", bar: t > barAt ? "×1" : null, barScale: back(U(t, barAt, barAt + 0.3)) });
  s += rainCloud(470, 820, t, 0.9);
  if (t < E("L13") + 0.3) s += word(820, 520, "WRONG!", 110, "#ff6a55", 8, back(U(t, S("L13"), S("L13") + 0.25)));
  const k = ease(U(t, barAt - 0.35, barAt + 0.1));
  return cam(470, lerp(1000, 1450, k), lerp(1.0, 1.4, k), -2, 0, 0, s);
}

function sThree(t) {
  const rise = ease(U(t, S("L15") + 0.2, E("L15") + 0.3)), barAt = MID("L16", 0.7);
  let s = cabin(t);
  s += passenger({ x: 230, y: 900, s: 0.7, skin: "#e0ac85", hair: "#2a2238", style: "afro", shirt: "#ffb347", expr: t > barAt ? "shock" : "neutral", t, seed: 1 });
  s += passenger({ x: 850, y: 900, s: 0.7, skin: "#f3cfb2", hair: "#c9c6d6", style: "bun", shirt: "#b5689a", expr: t > barAt ? "shock" : "neutral", glasses: true, t, seed: 2 });
  s += brick({ x: 540, y: lerp(2500, 1870, rise), s: 1.15, t, expr: "smug", chew: false, pose: "hips", bar: t > barAt ? "×3" : null, barScale: back(U(t, barAt, barAt + 0.35)) });
  const k = ease(U(t, barAt - 0.35, barAt + 0.1)), z = lerp(1.0, 1.35, k), cy = lerp(1000, 1500, k);
  const [sx, sy] = t > barAt ? shake(t, 10 * (1 - U(t, barAt, barAt + 0.5))) : [0, 0];
  return cam(540, cy, z, 0, sx, sy, s);
}

function sJaw(t, t0) {
  const z = lerp(1.0, 1.4, ease(U(t, t0, t0 + 0.6)));
  let s = `<rect x="-400" y="-400" width="1880" height="2720" fill="#3a2f66"/>`;
  s += g("translate(540 980) scale(1.8)", heroHead({ expr: "shock", t }));
  s += rainCloud(540, 640, t, 1.4, true);
  return cam(540, 980, z, 0, 0, 0, s);
}

function sMath(t) {
  const a1 = S("L17") + 0.05, a2 = MID("L17", 0.35), a3 = MID("L17", 0.8);
  let s = `<rect x="0" y="0" width="1080" height="1920" fill="#2d2350"/>`;
  s += g(`translate(540 600) rotate(${t * 10})`, Array.from({ length: 8 }, (_, i) => `<path d="M0,0 L${Math.cos(i * Math.PI / 4) * 1500},${Math.sin(i * Math.PI / 4) * 1500} L${Math.cos((i + 0.5) * Math.PI / 4) * 1500},${Math.sin((i + 0.5) * Math.PI / 4) * 1500} Z" fill="#3a2f66"/>`).join(""));
  if (t > a1) s += word(330, 470, "1", 220, "#fff", -6, back(U(t, a1, a1 + 0.25)));
  if (t > a2) s += word(620, 470, "+ 3", 220, "#fff", 4, back(U(t, a2, a2 + 0.25)));
  if (t > a3) s += word(480, 760, "= 4", 260, "#ffd23f", -4, back(U(t, a3, a3 + 0.3)));
  s += g("translate(470 1180) scale(1.2)", heroHead({ expr: t > a3 ? "cry" : "sad", t }));
  s += rainCloud(470, 935, t, 0.9, t > a3 && (t % 0.5) < 0.2);
  return s;
}

function sFall(t, t0) {
  const u = U(t, t0, t0 + 3.0);
  let s = sky(t, 0.4);
  s += plane({ x: lerp(640, 1400, ease(U(t, t0, t0 + 2.5))), y: 360, s: 0.6, t, smoke: true, face: "smile" });
  const dy = lerp(380, 2300, u * u);
  s += g(`rotate(${t * 140} 470 ${dy - 350})`, hero({ x: 470, y: dy, s: 0.5, t, expr: "shock", pose: "flail" }));
  s += rainCloud(470 + Math.sin(t * 3) * 20, dy - 640, t, 0.6, (t % 0.6) < 0.2);
  if (t > t0 + 0.3) s += word(760, dy - 520, "AAAAA!", 72, "#fff", 10, back(U(t, t0 + 0.3, t0 + 0.6)));
  if (t > D.total - 2.3) {
    const [sx, sy] = shake(t, 18 * (1 - U(t, D.total - 2.3, D.total - 1.85)));
    s = g(`translate(${sx} ${sy})`, s) + word(540, 1100, "THUD.", 160, "#fff", -4, back(U(t, D.total - 2.3, D.total - 2.05)));
  }
  return s;
}

// ---------- page api ----------


let SC = null;
function render(t) {
  SC = SC || scenes();
  let i = 0; while (i + 1 < SC.length && t >= SC[i + 1].at) i++;
  const tq = FILM_FPS ? Math.floor(t * FILM_FPS) / FILM_FPS : t;
  let body = SC[i].f(Math.max(tq, SC[i].at), SC[i].at);
  const inCabin = [sCaptain, sAsk, sLaugh, sOne, sThree].includes(SC[i].f);
  if (inCabin) body += `<rect x="0" y="0" width="1080" height="1920" fill="url(#alarm)"/>`;
  document.getElementById("v").innerHTML = stylize(DEFS + body, t);
  const c = D.caps.find((c) => t >= c.s && t < c.e);
  const esc = (s) => s.replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[m]);
  document.getElementById("cap").innerHTML = c ? esc(c.text).replace(/\b(\d+|ONE|THREE|FOUR|FIVE|Four|One|Three|Five|four|one|three|five)\b/g, "<b>$1</b>") : "";
}

function sfx() {
  const counts = [E("L06") - 0.45, MID("L08", 0.3), MID("L08", 0.5), MID("L08", 0.62), MID("L08", 0.72)];
  return [
    { name: "ding", at: E("L02") - 0.35 },
    { name: "whoosh", at: S("L03") - 0.1, gain: 0.8 },
    { name: "boom", at: E("L04") - 0.45 },
    { name: "alarm", at: E("L04") + 0.1, gain: 0.6 },
    { name: "pop", at: S("L05") - 0.05 },
    ...counts.map((at) => ({ name: "ding", at, gain: 0.8 })),
    { name: "pop", at: MID("L12", 0.68) },
    { name: "pop", at: S("L13") },
    { name: "ding", at: MID("L14", 0.62) },
    { name: "thud", at: MID("L16", 0.7), gain: 1.2 },
    { name: "pop", at: MID("L16", 0.7) },
    { name: "pop", at: S("L17") + 0.05 }, { name: "pop", at: MID("L17", 0.35) }, { name: "ding", at: MID("L17", 0.8) },
    { name: "trombone", at: E("L17") + 0.1, gain: 0.8 },
    { name: "whistle", at: S("L18") - 0.1, gain: 0.7 },
    { name: "thud", at: D.total - 2.3, gain: 1.4 },
  ];
}
</script>
</body>
</html>

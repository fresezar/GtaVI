<!doctype html>
<!-- Joke short #2, "The Man Who Found a Penguin". Driven by shorts/jokes/render.mjs: setup(data), render(t), sfx(). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("../../../node_modules/@fontsource/shrikhand/files/shrikhand-latin-400-normal.woff2"); }
  @font-face { font-family: "Sans"; src: url("../../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2"); font-weight: 100 1000; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1a1430; }
  svg { display: block; position: absolute; inset: 0; }
  text { font-family: "Display"; }
  .cap { position: absolute; left: 70px; right: 150px; top: 1370px; text-align: center; font-family: "Sans"; font-weight: 900;
         font-size: 84px; line-height: 1.04; color: #fff; text-transform: uppercase;
         -webkit-text-stroke: 16px #2a2238; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .cap b { color: #ffd23f; }
</style>
</head>
<body>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="cap" id="cap"></div>
<script src="../cast.js"></script>
<script>
let D = null;
function setup(d) { D = d; }

const heart = (x, y, s, a = 1) => g(`translate(${x} ${y}) scale(${s})`, `<path d="M0,18 C-30,-6 -24,-34 0,-20 C24,-34 30,-6 0,18 Z" fill="#ff5a7a" stroke="${O}" stroke-width="4" opacity="${a}"/>`);

function cinema(x, t) {
  let s = `<rect x="${x}" y="760" width="420" height="760" fill="#b0405a" stroke="${O}" stroke-width="6"/>`;
  s += `<rect x="${x - 20}" y="900" width="460" height="130" rx="12" fill="#2a2238" stroke="${O}" stroke-width="6"/>`;
  for (let i = 0; i < 14; i++) s += circ(x + 5 + i * 33, 912, 7, (Math.floor(t * 6) + i) % 2 ? "#ffd23f" : "#fff3b0", 2) + circ(x + 5 + i * 33, 1018, 7, (Math.floor(t * 6) + i + 1) % 2 ? "#ffd23f" : "#fff3b0", 2);
  s += `<text x="${x + 210}" y="990" font-size="72" fill="#ffd23f" text-anchor="middle">CINEMA</text>`;
  s += `<rect x="${x + 60}" y="1100" width="140" height="200" fill="#fff6d8" stroke="${O}" stroke-width="5"/><text x="${x + 130}" y="1190" font-size="36" fill="${O}" text-anchor="middle">FISH</text><text x="${x + 130}" y="1250" font-size="64" fill="#e8473b" text-anchor="middle">2</text>`;
  s += `<rect x="${x + 240}" y="1240" width="140" height="260" fill="#2a2238" stroke="${O}" stroke-width="5"/>`;
  return s;
}

// ---------- scenes ----------
function scenes() {
  return [
    { at: 0, f: sFind },
    { at: S("L04") - 0.1, f: sCop },
    { at: S("L07") - 0.15, f: sNextDay },
    { at: S("L07") + 0.95, f: sAgain },
    { at: S("L09") - 0.1, f: sAngry },
    { at: S("L10") - 0.1, f: sMovies },
    { at: E("L11") + 0.15, f: sLeave },
  ];
}

function sFind(t) {
  const walkEnd = E("L01") - 0.2, u = U(t, 0.1, walkEnd);
  const hx = lerp(-180, 300, u), walking = t < walkEnd;
  let s = street(t);
  s += penguin({ x: 770, y: 1500, s: 1.15, t, look: t > S("L03") ? -1 : 0 });
  s += hero({ x: hx, y: 1510, s: 1.0, t, walk: walking ? t * 9 : undefined, expr: t > MID("L02", 0.6) ? "shock" : "neutral", look: 0.4 });
  if (t > MID("L02", 0.7)) s += word(300, 610, "?!", 120, "#ffd23f", -8, back(U(t, MID("L02", 0.7), MID("L02", 0.7) + 0.25)));
  // push in on the penguin while it stares
  const k = ease(U(t, S("L03"), S("L03") + 1.2));
  return cam(lerp(540, 700, k), lerp(960, 1200, k), lerp(1.0, 1.7, k), 0, 0, 0, s);
}

function sCop(t, t0) {
  const cx = lerp(1300, 850, ease(U(t, t0, E("L04") - 0.1)));
  let s = street(t);
  s += penguin({ x: 540, y: 1500, s: 1.0, t, look: t < S("L05") ? 1 : t < S("L06") ? -1 : 1 });
  s += hero({ x: 220, y: 1510, s: 0.9, t, pose: t >= S("L05") && t < S("L06") ? "point" : "down", talk: talkOf("hero", t), expr: "neutral" });
  s += cop({ x: cx, y: 1510, s: 0.9, t, pose: t >= S("L06") ? "point" : "down", talk: talkOf("cop", t), expr: "calm" });
  if (t > S("L06") + 0.3) s += g(`translate(820 450) rotate(4) scale(${back(U(t, S("L06") + 0.3, S("L06") + 0.6))})`,
    P("M-170,-60 h290 l60,60 l-60,60 h-290 z", "#22a35a", 7) + `<text x="-20" y="26" font-size="76" fill="#fff" text-anchor="middle">ZOO</text>`);
  return s;
}

function sNextDay(t, t0) {
  let s = sky(t, 0.3);
  const sunY = lerp(1500, 700, ease(U(t, t0, t0 + 1.0)));
  s += circ(540, sunY, 170, "#ffd23f", 7);
  s += word(540, 520, "THE NEXT|DAY", 150, "#fff", -4, back(U(t, t0 + 0.05, t0 + 0.35)));
  return s;
}

function sAgain(t, t0) {
  const u = U(t, t0, S("L09") - 0.2), x = lerp(60, 330, u), ph = t * 7;
  let s = street(t);
  s += cop({ x: 860, y: 1510, s: 0.9, t, expr: t > MID("L08", 0.3) ? "shock" : "calm", pose: "down" });
  s += hero({ x, y: 1510, s: 0.9, t, walk: u < 1 ? ph : undefined, hold: "icecream", expr: "neutral", pose: "down" });
  s += penguin({ x: x + 230, y: 1500, s: 0.9, t, waddle: u < 1, glasses: true, hold: "icecream" });
  for (let i = 0; i < 4; i++) {
    const ph2 = ((t * 0.6 + i * 0.25) % 1);
    s += heart(x + 110 + Math.sin(i * 2 + t * 2) * 50, 900 - ph2 * 300, 1.2 + i * 0.1, 1 - ph2);
  }
  return s;
}

function sAngry(t, t0) {
  const [sx, sy] = shake(t, 6);
  let s = street(t);
  s += cop({ x: 860, y: 1510, s: 0.9, t, expr: "angry", pose: "fist", talk: talkOf("cop", t) });
  s += hero({ x: 330, y: 1510, s: 0.9, t, hold: "icecream", expr: "neutral" });
  s += penguin({ x: 560, y: 1500, s: 0.9, t, glasses: true, hold: "icecream" });
  s += word(900, 520, "!!", 140, "#ff6a55", 8, back(U(t, t0 + 0.1, t0 + 0.35)));
  const k = ease(U(t, t0, t0 + 0.4));
  return cam(lerp(600, 840, k), lerp(1000, 900, k), lerp(1.0, 1.45, k), 0, sx, sy, s);
}

function sMovies(t, t0) {
  const tk = talkOf("hero", t), tixAt = MID("L11", 0.55);
  let s = street(t);
  s += hero({ x: 330, y: 1510, s: 0.95, t, expr: tk > 0 ? "neutral" : "happy", talk: tk, hold: t > S("L11") ? "popcorn" : "icecream" });
  s += penguin({ x: 620, y: 1500, s: 0.95, t, expr: "happy", flap: t > tixAt && t < tixAt + 0.8, hold: t > tixAt ? "tickets" : "icecream" });
  if (t > tixAt) s += word(590, 720, "ADMIT 2", 90, "#ffd23f", -8, back(U(t, tixAt, tixAt + 0.3)));
  return cam(470, 1150, 1.3, 0, 0, 0, s);
}

function sLeave(t, t0) {
  const u = U(t, t0, t0 + 2.6), x = lerp(360, 700, u);
  let s = street(t) + cinema(640, t);
  s += hero({ x, y: 1510, s: 0.75, t, walk: t * 7, hold: "popcorn" });
  s += penguin({ x: x + 170, y: 1500, s: 0.75, t, waddle: true, glasses: true, hold: "tickets" });
  s += cop({ x: 170, y: 1700, s: 1.15, t, expr: "shock", pose: "down" });
  s += word(180, 560, "?!", 130, "#ffd23f", -6, back(U(t, t0 + 0.4, t0 + 0.7)));
  return s;
}

// ---------- page api ----------
let SC = null;
function render(t) {
  SC = SC || scenes();
  let i = 0; while (i + 1 < SC.length && t >= SC[i + 1].at) i++;
  const tq = FILM_FPS ? Math.floor(t * FILM_FPS) / FILM_FPS : t;
  const body = SC[i].f(Math.max(tq, SC[i].at), SC[i].at);
  document.getElementById("v").innerHTML = stylize(DEFS + body, t);
  const c = D.caps.find((c) => t >= c.s && t < c.e);
  const esc = (s) => s.replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[m]);
  document.getElementById("cap").innerHTML = c ? esc(c.text).replace(/\b(ZOO|zoo|Zoo|movies|MOVIES)\b/g, "<b>$1</b>") : "";
}

function sfx() {
  return [
    { name: "pop", at: MID("L02", 0.7) },
    { name: "whoosh", at: S("L04") - 0.1, gain: 0.6 },
    { name: "pop", at: S("L06") + 0.3 },
    { name: "ding", at: S("L07") - 0.1 },
    { name: "pop", at: S("L09") },
    { name: "ding", at: MID("L11", 0.55) },
    { name: "trombone", at: E("L11") + 0.3, gain: 0.7 },
  ];
}
</script>
</body>
</html>
